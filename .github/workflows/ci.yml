name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Exactement ce que lance le développeur : « vert chez moi » et « vert en
      # CI » redeviennent la même phrase.
      - run: npm run verify

      # `verify` ne compile pas le paquet : sans cette étape, une régression de
      # build ne se découvrirait qu'après fusion.
      - run: npm run build

      - name: Budget de poids
        run: |
          entry_budget=112640   # 110 kio, chunk d'entrée
          total_budget=204800   # 200 kio, tout le JS
          css_budget=15360      # 15 kio

          gz() { gzip -9 -c "$1" | wc -c; }
          sum() {
            total=0
            for file in $1; do
              [ -e "$file" ] || continue
              size=$(gz "$file")
              printf '%9d  %s\n' "$size" "$file" >&2
              total=$((total + size))
            done
            echo "$total"
          }

          js_total=$(sum "dist/assets/*.js")
          css_total=$(sum "dist/assets/*.css")
          entry=$(gz "$(ls dist/assets/index-*.js | head -1)")

          echo "entrée=$entry  js=$js_total  css=$css_total (octets gzip)"
          failed=0
          [ "$entry"     -le "$entry_budget" ] || { echo "::error::chunk d'entrée hors budget"; failed=1; }
          [ "$js_total"  -le "$total_budget" ] || { echo "::error::JS total hors budget"; failed=1; }
          [ "$css_total" -le "$css_budget"   ] || { echo "::error::CSS hors budget"; failed=1; }
          exit $failed

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    name: deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
